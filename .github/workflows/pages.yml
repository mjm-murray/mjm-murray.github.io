name: Deploy site with availability

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - name: Assemble site
        run: rsync -a --exclude .git --exclude .github --exclude .claude --exclude scripts ./ _site/

      # If the calendar can't be read, the site still deploys and the
      # availability section shows a fallback message instead of stale data.
      - name: Compute availability
        continue-on-error: true
        env:
          CALENDAR_ICS_URLS: ${{ secrets.CALENDAR_ICS_URLS }}
          AVAIL_PADDING_MIN: "15"
          AVAIL_MIN_SLOT_MIN: "30"
          AVAIL_DAYS_AHEAD: "6"
        run: python scripts/availability.py _site/availability.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
